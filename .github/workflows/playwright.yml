name: Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_LOG: "info"

jobs:
  e2e:
    # Playwright only installs Chromium and its system packages on Ubuntu
    # releases it knows. If this step starts failing right after
    # `ubuntu-latest` moves to a new release, upgrade `@playwright/test`.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      PORT: "8080"
      APP_NAME: Bibby
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "true"
      # Signs session cookies and keys the HMAC on emailed sign-in codes. The
      # app refuses anything shorter than 32 characters.
      JWT_SECRET: e2e-jwt-secret-at-least-32-characters
      # The address e2e/sign_in.spec.ts expects to become an admin.
      ADMIN_EMAILS: playwright+listed-admin@example.com
      # Stripe is left unset on purpose: the suite also proves the app runs
      # without billing. Dummy Google values show the Google button; nothing
      # in the suite completes a Google sign-in.
      GOOGLE_CLIENT_ID: e2e-client-id
      GOOGLE_CLIENT_SECRET: e2e-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:8080/auth/google/callback
      # Mounts the test-auth shim so specs can read emailed codes back.
      ENABLE_TEST_AUTH: "true"
      TEST_AUTH_TOKEN: ci-e2e-token

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Share the cache with the Rust check workflow so the debug build is
          # already warm by the time we get here.
          shared-key: bibby-debug
          cache-targets: "true"

      # GIT_HASH is baked in at compile time and shown on /admin/monitoring.
      - name: Build app (debug)
        run: cargo build --bin bibby --locked
        env:
          GIT_HASH: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Build Tailwind stylesheet
        run: npm run css:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # On a cache hit nothing is installed: the runner image already has the
      # system libraries Chromium needs (it ships Chrome). If Chromium stops
      # launching after a runner image update, restore an
      # `npx playwright install-deps chromium` step for cache hits.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The app applies its embedded migrations on startup.
      - name: Start app
        run: |
          ./target/debug/bibby > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app to be ready
        run: npx wait-on -t 60000 http://127.0.0.1:8080/

      - name: Run Playwright tests
        run: npx playwright test

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi

      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
