{#- The latest active announcement, loaded with the page (`infra/site.rs`). -#}
{% if let Some(a) = shared.site.banner %}
  <div class="banner banner-{{ a.severity }}" role="region" aria-label="Announcement">
    <div class="container-page py-2 text-sm text-center">
      <div class="banner-body">
        <strong class="mr-2">{{ a.title }}</strong>
        {{ a.message|safe }}
      </div>
    </div>
  </div>
{% endif %}
