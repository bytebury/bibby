<div class="card-header gap-3">
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <img src="{{ user.image_url }}" alt="" width="48" height="48"
         class="h-12 w-12 shrink-0 rounded-full border border-gray-200 object-cover" referrerpolicy="no-referrer" />
    <div class="min-w-0 flex-1">
      <h2 class="card-title truncate">Edit {{ user.full_name }}</h2>
      <p class="card-subtitle truncate">{{ user.email }}</p>
    </div>
  </div>
  <button type="button" class="btn-ghost shrink-0" onclick="closeModal()">&times;</button>
</div>

<form hx-patch="/users/{{ user.id }}" hx-swap="none" class="card-body space-y-4">
  <label class="block">
    <span class="label">Email</span>
    <input type="email" name="email" required autocomplete="off" maxlength="254" value="{{ user.email }}" class="input mt-1" />
    <span class="mt-1 block text-xs text-gray-500">Changing this points the account at a different login. The old address stops working right away.</span>
  </label>

  <label class="block">
    <span class="label">Role</span>
    <select name="role" class="input mt-1">
      <option value="free" {% if user.role == Role::Free %}selected{% endif %}>Free</option>
      <option value="professional" {% if user.role == Role::Professional %}selected{% endif %}>Professional</option>
      <option value="admin" {% if user.role == Role::Admin %}selected{% endif %}>Admin</option>
    </select>
  </label>

  <label class="block">
    <span class="label">Plan end date <span class="font-normal text-gray-400">(optional)</span></span>
    <input type="date" name="plan_expiry_date" class="input mt-1"
           value="{% if let Some(plan_expiry_date) = user.plan_expiry_date %}{{ plan_expiry_date }}{% endif %}" />
    <span class="mt-1 block text-xs text-gray-500">Last day of a Professional plan granted by hand. They're emailed a month, a week, and a day before, then moved to Free. Ignored for Free and Admin, and cleared if the plan moves to Stripe.</span>
  </label>

  <label class="flex items-center gap-2">
    <input type="checkbox" class="toggle" name="locked" {% if user.locked %}checked{% endif %} />
    <span class="text-sm">Locked (cannot sign in)</span>
  </label>

  <div class="flex justify-end pt-2">
    <button type="submit" class="btn-primary">Save</button>
  </div>
</form>
